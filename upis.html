<section class="max-w-2xl mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-6">Prijavite se za poziciju</h1>

    <form class="flex flex-col gap-4">
        <div class="flex flex-col md:flex-row gap-4 ">
            
            <div class="flex flex-col gap-1 w-full">
                <label for="name" class="text-sm font-medium">Ime i prezime</label>
                <input type="text" id="name" name="name"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
            </div>

            <div class="flex flex-col gap-1 w-full">
                <label for="email" class="text-sm font-medium"></label>E-mail</label>
                <input type="email" id="email" name="email"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label for="message" class="text-sm font-medium">Za koju poziciju se prijavljujete?</label>
            <textarea id="message" name="message" rows="2"
                class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"
            ></textarea>
        </div>

        <div class="flex flex-col gap-1">
            <label for="message" class="text-sm font-medium">Imate li iskustva u ovom području?</label>
            <textarea id="message" name="message" rows="2"
                class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"
            ></textarea>
        </div>

        <button type="submit"
            class="bg-blue-700 text-white font-semibold px-10 py-2 rounded-lg hover: bg-blue-800">
            Pošalji prijavu
        </button>
    </form>

</section>
